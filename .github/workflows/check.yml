name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -q -r requirements.txt pytest
      - run: python -m pytest tests -q
      - run: python doctor.py --offline

  install-sh:
    # the Mac and Linux installer, the way a reader runs it: download the pinned release,
    # check its signature, install, answer on the door, then the desk's own check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n install.sh
      - run: GREEKSOUP_HOME="$RUNNER_TEMP/desk" GREEKSOUP_PORT=8799 GREEKSOUP_NO_SERVICE=1 bash install.sh
      - run: test -f "$RUNNER_TEMP/desk/MANIFEST.sig" && curl -fsS http://127.0.0.1:8799/api/ping
      - run: cd "$RUNNER_TEMP/desk" && .venv/bin/python doctor.py --offline

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: .\scripts\windows_smoke.ps1

  windows-text:
    # Windows reads a child program's output in its own character set; these tests run
    # the desk's web-page and FRED reads there, where issue #5 happened
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -q -r requirements.txt pytest
      - run: python -m pytest tests/test_subprocess_text.py tests/test_errlog.py -q
